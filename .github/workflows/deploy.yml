name: Deploy site

# Publishes site content only. Infrastructure changes are applied by hand
# with Terraform, so this workflow's AWS role can upload files and invalidate
# the cache and do nothing else.

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "scripts/deploy-site.sh"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Build
        working-directory: app
        run: npm run build

      - name: Assume the deploy role through OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
          role-session-name: notesbynisha-site-deploy

      - name: Publish to S3 and invalidate CloudFront
        env:
          SITE_BUCKET: ${{ vars.SITE_BUCKET }}
          CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
        run: bash scripts/deploy-site.sh
